{{- if .Values.metrics.serviceMonitor.enabled }}
kind: ServiceMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
{{- with .Values.metrics.serviceMonitor.additionalLabels }}
{{- toYaml . | nindent 4 }}
{{- end }}
  name: {{ include "qdrant.fullname" . }}
{{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  endpoints:
    - honorLabels: true
      interval: {{ .Values.metrics.serviceMonitor.scrapeInterval }}
      path: {{ .Values.metrics.serviceMonitor.targetPath }}
      port: {{ .Values.metrics.serviceMonitor.targetPort }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}

      {{/* auto scheme: https if TLS is enabled on Qdrant, else http; can be overridden via values */}}
      {{- $sm := .Values.metrics.serviceMonitor -}}
      {{- $autoScheme := ternary "https" "http" .Values.config.service.enable_tls -}}
      {{- $scheme := default $autoScheme $sm.scheme }}
      scheme: {{ $scheme }}

      {{- /* render tlsConfig only when scraping over https or explicitly enabled */ -}}
      {{- $tls := $sm.tlsConfig -}}
      {{- if or (eq $scheme "https") ($tls.enabled | default false) }}
      tlsConfig:
        insecureSkipVerify: {{ default false $tls.insecureSkipVerify }}
        {{- with $tls.serverName }}
        serverName: {{ . }}
        {{- end }}
        {{- with $tls.caFile }}
        caFile: {{ . }}
        {{- end }}
      {{- end }}

{{- if .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
{{ tpl (toYaml .Values.metrics.serviceMonitor.metricRelabelings | indent 8) . }}
{{- end }}
{{- if .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
{{ tpl (toYaml .Values.metrics.serviceMonitor.relabelings | indent 8) . }}
{{- end }}
{{- if .Values.readOnlyApiKey }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "qdrant.fullname" . }}-apikey
          key: read-only-api-key
{{- else if .Values.apiKey }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "qdrant.fullname" . }}-apikey
          key: api-key
{{- end }}
  selector:
    matchLabels:
      {{- include "qdrant.labels" . | nindent 6 }}
      app.kubernetes.io/component: cluster-discovery
{{- end }}
